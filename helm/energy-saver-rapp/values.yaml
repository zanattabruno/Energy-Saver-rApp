# Default values for energy-saver-rapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: registry-docker-registry.registry.svc.cluster.local:5000/rapp_energy-saver
  pullPolicy: Always  # The image pull policy. Always pulls the image on every deployment.
  # Overrides the image tag whose default is the chart appVersion.
  tag: "TNSM-25"


resources: {}


nodeSelector: {}

tolerations: []

affinity: {}

# This file contains the configuration values for the Energy Saver Rapp application.

app:
  logging:
    level: INFO  # The logging level for the application.

  # Optimization configuration
  optimization:
    # Method to use for energy optimization: 'optimal' or 'heuristic'
    # - 'optimal': Uses the mathematical optimization model for best results (slower)
    # - 'heuristic': Uses the heuristic algorithm for faster results (less optimal)
    method: 'heuristic'

  # Energy configuration
  E2NodeList:
    - mcc: 724  # The Mobile Country Code for the E2Node.
      mnc: 11  # The Mobile Network Code for the E2Node.
      nodebid: 1  # The Node B ID for the E2Node.

  # Configuration settings for the energy-saver-rapp application scheduling
  scheduler:
    # Fixed time interval scheduling (in minutes)
    # Set to 0 to disable periodic scheduling and run only once
    interval_minutes: 5
    # Whether to run the application immediately on startup
    run_on_startup: true

  # Non-RT RIC configuration
  nonrtric:
    base_url_rApp_catalogue: 'http://rappcatalogueservice.nonrtric.svc.cluster.local:9085/services'  # The base URL for the rApp catalogue service.
    base_url_pms: 'http://nonrtricgateway.nonrtric.svc.cluster.local:9090/a1-policy/v2'  # The base URL for the PMS service.
    service_name: 'rAppEnergySaver'  # The name of the service.
    service_version: 'v1'  # The version of the service.
    service_display_name: 'rApp Energy Saver'  # The display name of the service.
    service_description: 'Energy-saving application for optimizing power consumption of E2Nodes'  # The description of the service.
    ric_id: 'ric4'  # The RIC ID.
    policytype_id: '5'  # The policy type ID.

  # Policy configuration defaults
  policy:
    ric_id: 'ric4'
    service_id: 'EnergySaverApp'
    policy_type_id: '5'

  # Near-RT RIC configuration (Prometheus)
  nearrtric:
    prometheus_url: 'http://r4-infrastructure-prometheus-server.ricplt.svc.cluster.local'

  # O1 Interface configuration for E2 simulator
  o1_interface:
    base_url: 'http://e2sim-e2sim-helm-o1.ricplt.svc.cluster.local:8090'
    timeout: 30