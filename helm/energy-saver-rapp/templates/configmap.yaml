apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "energy-saver-rapp.fullname" . }}-config
data:
  config.yaml: |
    # Logging configuration
    logging:
      level: {{ .Values.app.logging.level }}
    
    # Optimization configuration
    optimization:
      # Method to use for energy optimization: 'optimal' or 'heuristic'
      # - 'optimal': Uses the mathematical optimization model for best results (slower)
      # - 'heuristic': Uses the heuristic algorithm for faster results (less optimal)
      method: '{{ .Values.app.optimization.method }}'
    
    # Energy
    E2NodeList:
    {{- toYaml .Values.app.E2NodeList | nindent 4 }}
    
    # Configuration settings for the energy-saver-rapp application scheduling
    scheduler:
      # Fixed time interval scheduling (in minutes)
      # Set to 0 to disable periodic scheduling and run only once
      interval_minutes: {{ .Values.app.scheduler.interval_minutes }}
      # Whether to run the application immediately on startup
      run_on_startup: {{ .Values.app.scheduler.run_on_startup }}
    
    # Non-RT RIC configuration
    nonrtric:
      base_url_rApp_catalogue: '{{ .Values.app.nonrtric.base_url_rApp_catalogue }}'
      base_url_pms: '{{ .Values.app.nonrtric.base_url_pms }}'
      service_name: '{{ .Values.app.nonrtric.service_name }}'
      service_version: '{{ .Values.app.nonrtric.service_version }}'
      service_display_name: '{{ .Values.app.nonrtric.service_display_name }}'
      service_description: '{{ .Values.app.nonrtric.service_description }}'
      ric_id: '{{ .Values.app.nonrtric.ric_id }}'
      policytype_id: '{{ .Values.app.nonrtric.policytype_id }}'
    
    # Policy configuration defaults
    policy:
      ric_id: '{{ .Values.app.policy.ric_id }}'
      service_id: '{{ .Values.app.policy.service_id }}'
      policy_type_id: '{{ .Values.app.policy.policy_type_id }}'
    
    nearrtric:
      prometheus_url: '{{ .Values.app.nearrtric.prometheus_url }}'
    
    # O1 Interface configuration for E2 simulator
    o1_interface:
      base_url: '{{ .Values.app.o1_interface.base_url }}'
      timeout: {{ .Values.app.o1_interface.timeout }}
